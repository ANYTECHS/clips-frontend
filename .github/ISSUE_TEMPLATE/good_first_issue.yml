name: Good first issue (maintainers)
description: A small, well-scoped task for new contributors.
labels: ["good first issue"]
body:
  - type: markdown
    attributes:
      value: A good first issue needs no secrets or external services, touches only a few files, and has clear acceptance criteria.
  - type: textarea
    id: task
    attributes:
      label: Task
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Where to look
      description: The files or directories involved.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] …"
    validations:
      required: true
  - type: textarea
    id: hints
    attributes:
      label: Hints / related docs
