name: Security Audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high/critical)
        # Issue #1373 — fail the build on new high/critical advisories.
        run: npm audit --audit-level=high

      - name: External script SRI check
        # Issue #1372 — fail if any external <script src="https://…"> lacks
        # integrity + crossorigin attributes.
        run: node scripts/check-external-scripts.mjs
