name: Playwright Tests
on:
  push:
    branches: [ main, develop, feat/*, fix/*, cursor/* ]
  pull_request:
    branches: [ main, develop ]

defaults:
  run:
    working-directory: .

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CI: true
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      APPLE_ID: ci.apple.service.id
      APPLE_TEAM_ID: ci-apple-team-id
      APPLE_KEY_ID: ci-apple-key-id
      APPLE_PRIVATE_KEY: ci-apple-private-key
      NEXTAUTH_SECRET: ci-nextauth-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SENTRY_DSN: https://examplePublicKey@o0.ingest.sentry.io/0
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_STELLAR_RPC: https://soroban-testnet.stellar.org
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install dependencies
      run: npm install
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run full-page accessibility audits
      run: npm run test:a11y:e2e
    - name: Run visual regression tests
      run: npm run test:visual
    - name: Run upload-to-mint journey
      run: npx playwright test tests/e2e/upload-to-mint.spec.ts
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 30
