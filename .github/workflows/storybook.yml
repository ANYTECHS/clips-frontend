name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Storybook loads next.config.ts, which runs validateRequiredEnv() and fails
    # the build when required variables are missing. Stories never call these
    # services, so non-secret placeholders are enough.
    env:
      GOOGLE_CLIENT_ID: storybook
      GOOGLE_CLIENT_SECRET: storybook
      APPLE_ID: storybook
      APPLE_TEAM_ID: storybook
      APPLE_KEY_ID: storybook
      APPLE_PRIVATE_KEY: storybook
      NEXTAUTH_SECRET: storybook
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SENTRY_DSN: https://examplePublicKey@o0.ingest.sentry.io/0
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_AI_API_URL: http://localhost:3000
      AI_BACKEND_CALLBACK_SECRET: storybook
      CLOUD_STORAGE_PROVIDER: s3
      CLOUD_STORAGE_BUCKET: storybook
      CLOUD_STORAGE_REGION: us-east-1
      AWS_ACCESS_KEY_ID: storybook
      AWS_SECRET_ACCESS_KEY: storybook
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './storybook-static'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
