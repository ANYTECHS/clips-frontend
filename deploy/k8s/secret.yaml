# Secret — template only. Never commit real values.
# Populate with your secrets manager (Sealed Secrets, External Secrets
# Operator, Vault Agent, AWS Secrets Manager CSI driver, etc.).
#
# Quick bootstrap for local/dev clusters only:
#   kubectl create secret generic clipcash-frontend-secrets \
#     --from-literal=NEXTAUTH_SECRET=<value> \
#     --from-literal=REDIS_URL=<value> \
#     ... \
#     -n clipcash

apiVersion: v1
kind: Secret
metadata:
  name: clipcash-frontend-secrets
  namespace: clipcash
  labels:
    app.kubernetes.io/name: clipcash-frontend
  annotations:
    # If using External Secrets Operator, replace this file with an
    # ExternalSecret CRD that syncs from your secrets backend.
    kubernetes.io/description: "ClipCash frontend runtime secrets — do not commit real values"
type: Opaque
stringData:
  NEXTAUTH_SECRET: "REPLACE_ME"
  NEXTAUTH_URL: "REPLACE_ME"
  GOOGLE_CLIENT_ID: "REPLACE_ME"
  GOOGLE_CLIENT_SECRET: "REPLACE_ME"
  NEXT_PUBLIC_SENTRY_DSN: "REPLACE_ME"
  NEXT_PUBLIC_AI_API_URL: "REPLACE_ME"
  AI_BACKEND_SECRET: "REPLACE_ME"
  AI_BACKEND_CALLBACK_SECRET: "REPLACE_ME"
  CLOUD_STORAGE_BUCKET: "REPLACE_ME"
  CLOUD_STORAGE_REGION: "us-east-1"
  CLOUD_STORAGE_ENDPOINT: ""
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  REDIS_URL: "REPLACE_ME"
  CRON_SECRET: "REPLACE_ME"
  METRICS_TOKEN: "REPLACE_ME"
  VIRUS_SCAN_PROVIDER: "clamav"
  CLAMAV_API_URL: "REPLACE_ME"
