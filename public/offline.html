<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — ClipCash</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#0a0a0a;color:#fafafa;text-align:center;padding:1rem}
  .btn{display:inline-block;text-decoration:none;margin-top:1rem;padding:.6rem 1.2rem;border:0;border-radius:.5rem;background:#fafafa;color:#0a0a0a;font-weight:600;cursor:pointer}
  p{color:#a3a3a3}
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>Check your connection. Any changes you made will sync once you're back online.</p>
  <a class="btn" href="/">Try again</a>
</main>
</body>
</html>
